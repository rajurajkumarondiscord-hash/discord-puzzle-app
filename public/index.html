<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lovlys web page</title>
    <style>
        :root {
            --bg-dark: #090a0f;
            --bg-sidebar: #0d111a;
            --bg-server: #05070a;
            --text-normal: #e2e8f0;
            --text-muted: #8892b0;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --input-bg: #111827;
            --blue-glow: rgba(37, 99, 235, 0.35);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-normal); height: 100vh; overflow: hidden; }

        /* Puzzle Gate Screen */
        #puzzle-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #05070a, #1e3a8a);
        }
        .puzzle-card {
            background: var(--bg-sidebar);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px var(--blue-glow);
            border: 1px solid var(--accent);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .puzzle-card h2 { margin-bottom: 20px; color: #60a5fa; text-shadow: 0 0 10px var(--blue-glow); }
        .puzzle-card p { color: var(--text-muted); margin-bottom: 20px; font-size: 14px; }
        .puzzle-card input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: var(--input-bg);
            border: 1px solid var(--accent);
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
        }
        .puzzle-card input:focus { outline: none; border-color: #60a5fa; box-shadow: 0 0 8px var(--blue-glow); }
        .puzzle-card button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: filter 0.2s;
        }
        .puzzle-card button:hover { filter: brightness(1.2); box-shadow: 0 0 12px var(--blue-glow); }
        #error-msg { color: #f87171; font-size: 13px; margin-top: 10px; }

        /* Discord UI Layout */
        #chat-screen {
            display: none;
            height: 100vh;
            grid-template-columns: 80px 260px 1fr 240px;
        }
        
        /* Servers Sidebar */
        .servers-sidebar { background: var(--bg-server); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; border-right: 1px solid #1e293b; }
        .server-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #2563eb, #3b82f6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 0 10px var(--blue-glow); }

        /* Channels Sidebar */
        .channels-sidebar { background: var(--bg-sidebar); display: flex; flex-direction: column; padding: 16px; border-right: 1px solid #1e293b; overflow-y: auto; }
        .channels-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .channels-sidebar h3 { font-size: 13px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        .add-channel-btn { background: none; border: 1px solid var(--accent); color: #60a5fa; border-radius: 4px; width: 22px; height: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .add-channel-btn:hover { background: var(--accent); color: white; }

        .channel-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
        .channel-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 6px; color: var(--text-muted); cursor: pointer; font-weight: 500; transition: background 0.2s, color 0.2s; }
        .channel-item:hover { background: #1e293b; color: #fff; }
        .channel-item.active { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; box-shadow: 0 0 8px var(--blue-glow); }
        .channel-actions { display: flex; gap: 4px; }
        .channel-actions button { background: none; border: none; color: inherit; cursor: pointer; font-size: 12px; opacity: 0.7; }
        .channel-actions button:hover { opacity: 1; }

        /* Main Chat Area */
        .chat-main { display: flex; flex-direction: column; background: linear-gradient(135deg, #090a0f, #0f172a); height: 100vh; flex: 1; }
        .chat-header { height: 48px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; padding: 0 20px; font-weight: bold; font-size: 16px; color: #60a5fa; box-shadow: 0 1px 4px rgba(37,99,235,0.2); }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .message { display: flex; flex-direction: column; }
        .message .msg-user { font-weight: 600; font-size: 14px; color: #93c5fd; margin-bottom: 2px; }
        .message .msg-user span { font-weight: normal; font-size: 11px; color: var(--text-muted); margin-left: 6px; }
        .message .msg-text { font-size: 15px; color: var(--text-normal); word-break: break-word; line-height: 1.4; }
        .message .msg-text img { max-width: 250px; border-radius: 6px; margin-top: 6px; display: block; }
        .message.system-msg .msg-text { color: var(--text-muted); font-style: italic; font-size: 13px; border-left: 2px solid var(--accent); padding-left: 8px; }

        /* Chat Input & Popovers */
        .chat-input-area { padding: 0 20px 24px 20px; position: relative; }
        .chat-input-wrapper { background: var(--input-bg); border-radius: 8px; display: flex; align-items: center; padding: 10px 18px; border: 1px solid #1e293b; }
        .chat-input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 8px var(--blue-glow); }
        .chat-input-wrapper input { background: transparent; border: none; outline: none; width: 100%; color: #fff; font-size: 15px; }
        
        .action-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 0 4px; transition: transform 0.1s; color: var(--text-muted); }
        .action-btn:hover { transform: scale(1.2); color: #fff; }

        /* Popovers for Emoji & GIFs */
        .picker-popup {
            display: none;
            position: absolute;
            bottom: 80px;
            left: 20px;
            background: var(--bg-sidebar);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 12px;
            width: 300px;
            box-shadow: 0 4px 16px var(--blue-glow);
            z-index: 100;
        }
        .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
        .emoji-grid span { font-size: 20px; cursor: pointer; text-align: center; padding: 4px; border-radius: 4px; }
        .emoji-grid span:hover { background: #1e293b; }

        .gif-popup input { width: 100%; padding: 8px; background: var(--input-bg); border: 1px solid var(--accent); border-radius: 4px; color: #fff; margin-bottom: 8px; outline: none; }
        .gif-results { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; max-height: 200px; overflow-y: auto; }
        .gif-results img { width: 100%; height: 90px; object-fit: cover; border-radius: 4px; cursor: pointer; transition: transform 0.1s; }
        .gif-results img:hover { transform: scale(1.03); border: 1px solid #60a5fa; }

        /* Members Sidebar */
        .members-sidebar { background: var(--bg-sidebar); padding: 16px; border-left: 1px solid #1e293b; overflow-y: auto; }
        .members-sidebar h4 { font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.5px; }
        .member-item { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 14px; color: var(--text-muted); }
        .member-dot { width: 8px; height: 8px; background: #3b82f6; box-shadow: 0 0 6px #60a5fa; border-radius: 50%; }
    </style>
</head>
<body>

    <!-- Puzzle Gate Screen -->
    <div id="puzzle-screen">
        <div class="puzzle-card">
            <h2>Access Gate</h2>
            <p>What is my favourite number?</p>
            <input type="text" id="username-input" placeholder="Your Username..." autocomplete="off">
            <input type="number" id="puzzle-input" placeholder="Enter number..." autocomplete="off">
            <button onclick="tryEnter()">Enter Website</button>
            <div id="error-msg"></div>
        </div>
    </div>

    <!-- Discord UI Chat Screen -->
    <div id="chat-screen">
        <!-- Servers Sidebar -->
        <div class="servers-sidebar">
            <div class="server-icon" title="Main Server">PS</div>
        </div>

        <!-- Channels & Games Sidebar -->
        <div class="channels-sidebar">
            <div class="channels-header">
                <h3>Text Channels</h3>
                <button class="add-channel-btn" onclick="createNewChannel()" title="Add Channel">+</button>
            </div>
            <div class="channel-list" id="channel-list-container"></div>

            <div class="channels-header" style="margin-top: 10px;">
                <h3>Games & Links</h3>
                <button class="add-channel-btn" onclick="addGameShortcut()" title="Add Website Shortcut">+</button>
            </div>
            <div class="channel-list" id="games-list-container"></div>
        </div>

        <!-- Chat Main Container -->
        <div class="chat-main">
            <div class="chat-header" id="current-channel-title"># general-chat</div>
            <div class="chat-messages" id="messages-container"></div>
            <div class="chat-input-area">
                <!-- Emoji Picker Popup -->
                <div class="picker-popup" id="emoji-picker">
                    <div class="emoji-grid">
                        <span onclick="insertEmoji('😀')">😀</span>
                        <span onclick="insertEmoji('😂')">😂</span>
                        <span onclick="insertEmoji('🔥')">🔥</span>
                        <span onclick="insertEmoji('👍')">👍</span>
                        <span onclick="insertEmoji('💙')">💙</span>
                        <span onclick="insertEmoji('🚀')">🚀</span>
                        <span onclick="insertEmoji('✨')">✨</span>
                        <span onclick="insertEmoji('😎')">😎</span>
                        <span onclick="insertEmoji('🎉')">🎉</span>
                        <span onclick="insertEmoji('💯')">💯</span>
                        <span onclick="insertEmoji('⚡')">⚡</span>
                        <span onclick="insertEmoji('💀')">💀</span>
                    </div>
                </div>

                <!-- GIF Picker Popup (Tenor) -->
                <div class="picker-popup gif-popup" id="gif-picker">
                    <input type="text" id="gif-search-input" placeholder="Search Tenor GIFs..." oninput="searchTenorGIFs(this.value)">
                    <div class="gif-results" id="gif-results-container"></div>
                </div>

                <div class="chat-input-wrapper">
                    <input type="text" id="message-input" placeholder="Message #general-chat" onkeypress="handleKeyPress(event)" autocomplete="off">
                    <button class="action-btn" onclick="togglePicker('emoji-picker')" title="Add Emoji">😀</button>
                    <button class="action-btn" onclick="togglePicker('gif-picker')" title="Send GIF">🎞️</button>
                </div>
            </div>
        </div>

        <!-- Members Sidebar -->
        <div class="members-sidebar">
            <h4>Online — <span id="member-count">0</span></h4>
            <div id="members-list"></div>
        </div>
    </div>

    <!-- Socket.io & Logic -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentChannel = 'general-chat';
        let allChannels = [];
        let channelMessages = {};
        
        // Custom Games & Web shortcuts list
        let gamesList = [
            { name: 'Smash Karts', url: 'https://smashkarts.io' },
            { name: 'Poki Games', url: 'https://poki.com' }
        ];

        function tryEnter() {
            const username = document.getElementById('username-input').value;
            const answer = document.getElementById('puzzle-input').value;
            socket.emit('join-chat', { username, answer });
        }

        socket.on('auth-success', () => {
            document.getElementById('puzzle-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'grid';
            renderGames();
        });

        socket.on('auth-error', (msg) => {
            document.getElementById('error-msg').innerText = msg;
        });

        socket.on('init-data', ({ channels, messages }) => {
            allChannels = channels;
            channelMessages = messages;
            renderChannels();
            renderMessages();
        });

        socket.on('update-channels', (channels) => {
            allChannels = channels;
            if (!allChannels.includes(currentChannel)) {
                currentChannel = allChannels[0] || 'general-chat';
            }
            renderChannels();
            renderMessages();
        });

        socket.on('new-message', ({ channel, message }) => {
            if (!channelMessages[channel]) channelMessages[channel] = [];
            channelMessages[channel].push(message);
            if (channelMessages[channel].length > 100) channelMessages[channel].shift();
            
            if (channel === currentChannel) {
                appendMessage(message);
            }
        });

        socket.on('update-users', (users) => {
            const listContainer = document.getElementById('members-list');
            document.getElementById('member-count').innerText = users.length;
            listContainer.innerHTML = '';
            users.forEach(user => {
                listContainer.innerHTML += `
                    <div class="member-item">
                        <div class="member-dot"></div>
                        <span>${user}</span>
                    </div>
                `;
            });
        });

        function renderChannels() {
            const container = document.getElementById('channel-list-container');
            container.innerHTML = '';
            allChannels.forEach(ch => {
                const isActive = ch === currentChannel;
                container.innerHTML += `
                    <div class="channel-item ${isActive ? 'active' : ''}" onclick="switchChannel('${ch}')">
                        <span># ${ch}</span>
                        <div class="channel-actions">
                            <button onclick="event.stopPropagation(); renameChannel('${ch}')" title="Rename">✏️</button>
                            ${allChannels.length > 1 ? `<button onclick="event.stopPropagation(); deleteChannel('${ch}')" title="Delete">🗑️</button>` : ''}
                        </div>
                    </div>
                `;
            });
            document.getElementById('current-channel-title').innerText = `# ${currentChannel}`;
            document.getElementById('message-input').placeholder = `Message #${currentChannel}`;
        }

        function renderGames() {
            const container = document.getElementById('games-list-container');
            container.innerHTML = '';
            gamesList.forEach((game, index) => {
                container.innerHTML += `
                    <div class="channel-item" onclick="window.open('${game.url}', '_blank')">
                        <span>🎮 ${game.name}</span>
                        <div class="channel-actions">
                            <button onclick="event.stopPropagation(); deleteGame(${index})" title="Delete">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        function addGameShortcut() {
            const name = prompt('Enter website name (e.g. YouTube):');
            if (!name) return;
            let url = prompt('Enter website URL (e.g. https://youtube.com):');
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            gamesList.push({ name, url });
            renderGames();
        }

        function deleteGame(index) {
            gamesList.splice(index, 1);
            renderGames();
        }

        function switchChannel(ch) {
            currentChannel = ch;
            renderChannels();
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            const messages = channelMessages[currentChannel] || [];
            messages.forEach(msg => appendMessage(msg));
        }

        function createNewChannel() {
            const name = prompt('Enter new channel name:');
            if (name) {
                socket.emit('create-channel', name);
            }
        }

        function renameChannel(oldName) {
            const newName = prompt(`Rename channel #${oldName} to:`, oldName);
            if (newName && newName !== oldName) {
                socket.emit('rename-channel', { oldName, newName });
            }
        }

        function deleteChannel(chName) {
            if (confirm(`Are you sure you want to delete #${chName}?`)) {
                socket.emit('delete-channel', chName);
            }
        }

        function togglePicker(pickerId) {
            const emojiPicker = document.getElementById('emoji-picker');
            const gifPicker = document.getElementById('gif-picker');
            
            if (pickerId === 'emoji-picker') {
                gifPicker.style.display = 'none';
                emojiPicker.style.display = emojiPicker.style.display === 'block' ? 'none' : 'block';
            } else {
                emojiPicker.style.display = 'none';
                gifPicker.style.display = gifPicker.style.display === 'block' ? 'none' : 'block';
                if (gifPicker.style.display === 'block') {
                    searchTenorGIFs('trending'); // load initial trending GIFs
                }
            }
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('message-input');
            input.value += emoji;
            input.focus();
            document.getElementById('emoji-picker').style.display = 'none';
        }

        // Tenor GIF Integration using public API key
        async function searchTenorGIFs(query) {
            const container = document.getElementById('gif-results-container');
            container.innerHTML = 'Loading...';
            try {
                const searchQ = query.trim() || 'trending';
                const response = await fetch(`https://tenor.googleapis.com/v2/search?q=${encodeURIComponent(searchQ)}&key=LIVDSRZULELA&limit=8`);
                const data = await response.json();
                container.innerHTML = '';
                data.results.forEach(gif => {
                    const imgUrl = gif.media_formats.tinygif.url;
                    const fullUrl = gif.media_formats.gif.url;
                    const img = document.createElement('img');
                    img.src = imgUrl;
                    img.onclick = () => {
                        socket.emit('send-message', { channel: currentChannel, text: `<img src="${fullUrl}" alt="GIF"/>` });
                        document.getElementById('gif-picker').style.display = 'none';
                    };
                    container.appendChild(img);
                });
            } catch (err) {
                container.innerHTML = '<span style="font-size:12px; color:#f87171;">Failed to load GIFs</span>';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('message-input');
                const text = input.value.trim();
                if (text) {
                    socket.emit('send-message', { channel: currentChannel, text });
                    input.value = '';
                }
            }
        }

        function appendMessage(msg) {
            const container = document.getElementById('messages-container');
            const msgDiv = document.createElement('div');
            
            if (msg.system) {
                msgDiv.className = 'message system-msg';
                msgDiv.innerHTML = `<div class="msg-text">${msg.text}</div>`;
            } else {
                msgDiv.className = 'message';
                msgDiv.innerHTML = `
                    <div class="msg-user">${msg.user}<span>Today at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></div>
                    <div class="msg-text">${msg.text}</div>
                `;
            }
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
