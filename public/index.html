<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Gate & Bloody Chat</title>
    <style>
        :root {
            --bg-dark: #120507;
            --bg-sidebar: #1a080a;
            --bg-server: #0b0203;
            --text-normal: #f0d5d8;
            --text-muted: #a67a80;
            --accent: #8b0000;
            --accent-hover: #b22222;
            --input-bg: #240a0d;
            --blood-glow: rgba(139, 0, 0, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-normal); height: 100vh; overflow: hidden; }

        /* Puzzle Gate Screen */
        #puzzle-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0b0203, #240a0d);
        }
        .puzzle-card {
            background: var(--bg-sidebar);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 8px 32px var(--blood-glow);
            border: 1px solid var(--accent);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .puzzle-card h2 { margin-bottom: 20px; color: #ff4d4d; text-shadow: 0 0 10px var(--blood-glow); }
        .puzzle-card p { color: var(--text-muted); margin-bottom: 20px; font-size: 14px; }
        .puzzle-card input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: var(--input-bg);
            border: 1px solid var(--accent);
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
        }
        .puzzle-card input:focus { outline: none; border-color: #ff4d4d; box-shadow: 0 0 8px var(--blood-glow); }
        .puzzle-card button {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            border: none;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        .puzzle-card button:hover { background: var(--accent-hover); box-shadow: 0 0 12px var(--accent-hover); }
        #error-msg { color: #ff6b6b; font-size: 13px; margin-top: 10px; }

        /* Discord UI Layout */
        #chat-screen {
            display: none;
            height: 100vh;
            grid-template-columns: 80px 260px 1fr 240px;
        }
        
        /* Servers Sidebar */
        .servers-sidebar { background: var(--bg-server); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; border-right: 1px solid #2b0509; }
        .server-icon { width: 48px; height: 48px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 0 10px var(--blood-glow); }

        /* Channels Sidebar */
        .channels-sidebar { background: var(--bg-sidebar); display: flex; flex-direction: column; padding: 16px; border-right: 1px solid #2b0509; }
        .channels-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .channels-sidebar h3 { font-size: 14px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        .add-channel-btn { background: none; border: 1px solid var(--accent); color: #ff6b6b; border-radius: 4px; width: 22px; height: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .add-channel-btn:hover { background: var(--accent); color: white; }

        .channel-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex: 1; }
        .channel-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 4px; color: var(--text-muted); cursor: pointer; font-weight: 500; transition: background 0.2s, color 0.2s; }
        .channel-item:hover { background: #33080d; color: #fff; }
        .channel-item.active { background: var(--accent); color: #fff; box-shadow: 0 0 8px var(--blood-glow); }
        .channel-actions button { background: none; border: none; color: inherit; cursor: pointer; font-size: 12px; opacity: 0.7; margin-left: 4px; }
        .channel-actions button:hover { opacity: 1; }

        /* Main Chat Area */
        .chat-main { display: flex; flex-direction: column; background: var(--bg-dark); height: 100vh; flex: 1; }
        .chat-header { height: 48px; border-bottom: 1px solid #2b0509; display: flex; align-items: center; padding: 0 20px; font-weight: bold; font-size: 16px; color: #ff6b6b; box-shadow: 0 1px 4px rgba(139,0,0,0.2); }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .message { display: flex; flex-direction: column; }
        .message .msg-user { font-weight: 600; font-size: 14px; color: #ff8080; margin-bottom: 2px; }
        .message .msg-user span { font-weight: normal; font-size: 11px; color: var(--text-muted); margin-left: 6px; }
        .message .msg-text { font-size: 15px; color: var(--text-normal); word-break: break-word; line-height: 1.4; }
        .message.system-msg .msg-text { color: var(--text-muted); font-style: italic; font-size: 13px; border-left: 2px solid var(--accent); padding-left: 8px; }

        /* Chat Input & Emoji Picker */
        .chat-input-area { padding: 0 20px 24px 20px; position: relative; }
        .chat-input-wrapper { background: var(--input-bg); border-radius: 8px; display: flex; align-items: center; padding: 10px 18px; border: 1px solid #33080d; }
        .chat-input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 8px var(--blood-glow); }
        .chat-input-wrapper input { background: transparent; border: none; outline: none; width: 100%; color: #fff; font-size: 15px; }
        
        .emoji-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 0 6px; transition: transform 0.1s; }
        .emoji-btn:hover { transform: scale(1.2); }
        
        .emoji-picker {
            display: none;
            position: absolute;
            bottom: 80px;
            left: 20px;
            background: var(--bg-sidebar);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 10px;
            width: 240px;
            box-shadow: 0 4px 16px var(--blood-glow);
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            z-index: 100;
        }
        .emoji-picker span { font-size: 20px; cursor: pointer; text-align: center; padding: 4px; border-radius: 4px; }
        .emoji-picker span:hover { background: #33080d; }

        /* Members Sidebar */
        .members-sidebar { background: var(--bg-sidebar); padding: 16px; border-left: 1px solid #2b0509; overflow-y: auto; }
        .members-sidebar h4 { font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.5px; }
        .member-item { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 14px; color: var(--text-muted); }
        .member-dot { width: 8px; height: 8px; background: #8b0000; box-shadow: 0 0 6px #ff0000; border-radius: 50%; }
    </style>
</head>
<body>

    <!-- Puzzle Gate Screen -->
    <div id="puzzle-screen">
        <div class="puzzle-card">
            <h2>Access Gate</h2>
            <p>What is my favourite number?</p>
            <input type="text" id="username-input" placeholder="Your Username..." autocomplete="off">
            <input type="number" id="puzzle-input" placeholder="Enter number..." autocomplete="off">
            <button onclick="tryEnter()">Enter Website</button>
            <div id="error-msg"></div>
        </div>
    </div>

    <!-- Discord UI Chat Screen -->
    <div id="chat-screen">
        <!-- Servers Sidebar -->
        <div class="servers-sidebar">
            <div class="server-icon" title="Main Server">PS</div>
        </div>

        <!-- Channels Sidebar -->
        <div class="channels-sidebar">
            <div class="channels-header">
                <h3>Text Channels</h3>
                <button class="add-channel-btn" onclick="createNewChannel()" title="Add Channel">+</button>
            </div>
            <div class="channel-list" id="channel-list-container"></div>
        </div>

        <!-- Chat Main Container -->
        <div class="chat-main">
            <div class="chat-header" id="current-channel-title"># general-chat</div>
            <div class="chat-messages" id="messages-container"></div>
            <div class="chat-input-area">
                <!-- Emoji Picker Popover -->
                <div class="emoji-picker" id="emoji-picker">
                    <span onclick="insertEmoji('💀')">💀</span>
                    <span onclick="insertEmoji('🩸')">🩸</span>
                    <span onclick="insertEmoji('🔪')">🔪</span>
                    <span onclick="insertEmoji('🦇')">🦇</span>
                    <span onclick="insertEmoji('🔥')">🔥</span>
                    <span onclick="insertEmoji('👻')">👻</span>
                    <span onclick="insertEmoji('😈')">😈</span>
                    <span onclick="insertEmoji('🖤')">🖤</span>
                    <span onclick="insertEmoji('💔')">💔</span>
                    <span onclick="insertEmoji('😀')">😀</span>
                    <span onclick="insertEmoji('😂')">😂</span>
                    <span onclick="insertEmoji('👍')">👍</span>
                </div>
                <div class="chat-input-wrapper">
                    <input type="text" id="message-input" placeholder="Message #general-chat" onkeypress="handleKeyPress(event)" autocomplete="off">
                    <button class="emoji-btn" onclick="toggleEmojiPicker()" title="Add Emoji">😀</button>
                </div>
            </div>
        </div>

        <!-- Members Sidebar -->
        <div class="members-sidebar">
            <h4>Online — <span id="member-count">0</span></h4>
            <div id="members-list"></div>
        </div>
    </div>

    <!-- Socket.io & Logic -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentChannel = 'general-chat';
        let allChannels = [];
        let channelMessages = {};

        function tryEnter() {
            const username = document.getElementById('username-input').value;
            const answer = document.getElementById('puzzle-input').value;
            socket.emit('join-chat', { username, answer });
        }

        socket.on('auth-success', () => {
            document.getElementById('puzzle-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'grid';
        });

        socket.on('auth-error', (msg) => {
            document.getElementById('error-msg').innerText = msg;
        });

        socket.on('init-data', ({ channels, messages }) => {
            allChannels = channels;
            channelMessages = messages;
            renderChannels();
            renderMessages();
        });

        socket.on('update-channels', (channels) => {
            allChannels = channels;
            if (!allChannels.includes(currentChannel)) {
                currentChannel = allChannels[0] || 'general-chat';
            }
            renderChannels();
            renderMessages();
        });

        socket.on('new-message', ({ channel, message }) => {
            if (!channelMessages[channel]) channelMessages[channel] = [];
            channelMessages[channel].push(message);
            if (channelMessages[channel].length > 100) channelMessages[channel].shift();
            
            if (channel === currentChannel) {
                appendMessage(message);
            }
        });

        socket.on('update-users', (users) => {
            const listContainer = document.getElementById('members-list');
            document.getElementById('member-count').innerText = users.length;
            listContainer.innerHTML = '';
            users.forEach(user => {
                listContainer.innerHTML += `
                    <div class="member-item">
                        <div class="member-dot"></div>
                        <span>${user}</span>
                    </div>
                `;
            });
        });

        function renderChannels() {
            const container = document.getElementById('channel-list-container');
            container.innerHTML = '';
            allChannels.forEach(ch => {
                const isActive = ch === currentChannel;
                container.innerHTML += `
                    <div class="channel-item ${isActive ? 'active' : ''}" onclick="switchChannel('${ch}')">
                        <span># ${ch}</span>
                        <div class="channel-actions">
                            <button onclick="event.stopPropagation(); renameChannel('${ch}')" title="Rename">✏️</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('current-channel-title').innerText = `# ${currentChannel}`;
            document.getElementById('message-input').placeholder = `Message #${currentChannel}`;
        }

        function switchChannel(ch) {
            currentChannel = ch;
            renderChannels();
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            const messages = channelMessages[currentChannel] || [];
            messages.forEach(msg => appendMessage(msg));
        }

        function createNewChannel() {
            const name = prompt('Enter new channel name:');
            if (name) {
                socket.emit('create-channel', name);
            }
        }

        function renameChannel(oldName) {
            const newName = prompt(`Rename channel #${oldName} to:`, oldName);
            if (newName && newName !== oldName) {
                socket.emit('rename-channel', { oldName, newName });
            }
        }

        function toggleEmojiPicker() {
            const picker = document.getElementById('emoji-picker');
            picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('message-input');
            input.value += emoji;
            input.focus();
            document.getElementById('emoji-picker').style.display = 'none';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('message-input');
                const text = input.value.trim();
                if (text) {
                    socket.emit('send-message', { channel: currentChannel, text });
                    input.value = '';
                }
            }
        }

        function appendMessage(msg) {
            const container = document.getElementById('messages-container');
            const msgDiv = document.createElement('div');
            
            if (msg.system) {
                msgDiv.className = 'message system-msg';
                msgDiv.innerHTML = `<div class="msg-text">${msg.text}</div>`;
            } else {
                msgDiv.className = 'message';
                msgDiv.innerHTML = `
                    <div class="msg-user">${msg.user}<span>Today at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></div>
                    <div class="msg-text">${msg.text}</div>
                `;
            }
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
